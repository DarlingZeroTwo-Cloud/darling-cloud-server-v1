name: Run Darling Cloud Server (EasyTier)

on:
  push:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    concurrency:
      group: darling-cloud-server
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Start EasyTier Server
        run: |
          chmod +x bin/easytier-core bin/frpc
          mkdir -p bin/log
          cd bin
          nohup ./easytier-core -l 29872 --network-name easytier --network-secret 123456 > server.log 2>&1 &
          sleep 3
          echo "EasyTier server started"
          cat server.log || true
          echo "=== listening ==="
          ss -ulnp | grep 29872 || echo "udp not listening"
          ss -tlnp | grep 29872 || echo "tcp not listening"

      - name: Start ChmlFrp tunnel
        run: |
          cd bin
          nohup ./frpc -u wEx9KAA67lhn7ps3xRbH7UCr -p 356575 > frpc.log 2>&1 &
          sleep 3
          echo "Frpc started"
          cat frpc.log || true

      - name: Start EasyTier Client (join network)
        run: |
          cd bin
          nohup ./easytier-core --peers "127.0.0.1:29872" --network-name easytier --network-secret 123456 > client.log 2>&1 &
          sleep 5
          echo "EasyTier client started"
          cat client.log || true

      - name: Start Cloudreve
        run: |
          cd bin
          chmod +x cloudreve
          nohup ./cloudreve > cloudreve.log 2>&1 &
          sleep 5
          echo "Cloudreve started"
          cat cloudreve.log || true
          ss -tlnp | grep 5212 || echo "cloudreve not listening"

      - name: Keep alive
        run: |
          echo "Running for ~4 hours..."
          for i in $(seq 1 230); do
            sleep 60
            if ! pgrep -f "easytier-core.*-l 29872" > /dev/null; then
              echo "EasyTier server died, restarting..."
              cd bin && ./easytier-core -l 29872 --network-name easytier --network-secret 123456 >> server.log 2>&1 &
            fi
            if ! pgrep -f "easytier-core.*--peers" > /dev/null; then
              echo "EasyTier client died, restarting..."
              cd bin && ./easytier-core --peers "127.0.0.1:29872" --network-name easytier --network-secret 123456 >> client.log 2>&1 &
            fi
            if ! pgrep -f "frpc -u" > /dev/null; then
              echo "Frpc died, restarting..."
              cd bin && ./frpc -u wEx9KAA67lhn7ps3xRbH7UCr -p 356575 >> frpc.log 2>&1 &
            fi
            if ! pgrep -f "cloudreve" > /dev/null; then
              echo "Cloudreve died, restarting..."
              cd bin && ./cloudreve >> cloudreve.log 2>&1 &
            fi
          done
