name: Run Darling Cloud Server (EasyTier)

on:
  push:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    concurrency:
      group: darling-cloud-server
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Start EasyTier Server
        run: |
          chmod +x bin/easytier-core bin/frpc
          mkdir -p bin/log
          cd bin
          nohup ./easytier-core --listen 0.0.0.0:29872 --encryption true > server.log 2>&1 &
          sleep 3
          echo "EasyTier started"
          cat server.log || true
          echo "=== listening ==="
          ss -ulnp | grep 29872 || echo "not listening"
          ss -tlnp | grep 29872 || echo "tcp not listening"

      - name: Start ChmlFrp tunnel
        run: |
          cd bin
          nohup ./frpc -u wEx9KAA67lhn7ps3xRbH7UCr -p 356575 > frpc.log 2>&1 &
          sleep 3
          echo "Frpc started"
          cat frpc.log || true

      - name: Start EasyTier Client (join network)
        run: |
          cd bin
          nohup ./easytier-core --peer "127.0.0.1:29872" --network-secret "123456" > client.log 2>&1 &
          sleep 5
          echo "EasyTier client started"
          cat client.log || true
          echo "=== server log ==="
          cat server.log || true
          echo "=== node list ==="
          sleep 5
          ./easytier-cli peer 2>/dev/null || echo "cli failed"
          ./easytier-node 2>/dev/null || echo "node cmd failed"

      - name: Keep alive
        run: |
          echo "Running for ~4 hours..."
          for i in $(seq 1 230); do
            sleep 60
            if ! pgrep -f "easytier-core.*listen" > /dev/null; then
              echo "EasyTier server died, restarting..."
              cd bin && ./easytier-core --listen 0.0.0.0:29872 --encryption true >> server.log 2>&1 &
            fi
            if ! pgrep -f "easytier-core.*peer" > /dev/null; then
              echo "EasyTier client died, restarting..."
              cd bin && ./easytier-core --peer "127.0.0.1:29872" --network-secret "123456" >> client.log 2>&1 &
            fi
            if ! pgrep -f "frpc -u" > /dev/null; then
              echo "Frpc died, restarting..."
              cd bin && ./frpc -u wEx9KAA67lhn7ps3xRbH7UCr -p 356575 >> frpc.log 2>&1 &
            fi
          done
