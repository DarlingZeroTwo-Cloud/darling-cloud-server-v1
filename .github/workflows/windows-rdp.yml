name: Windows RDP via Tailscale

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'RDP 密码（至少8位，含数字和符号）'
        default: 'Darling@2026'
        required: true

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - name: Create user and enable RDP
        run: |
          $password = "${{ github.event.inputs.password }}"
          net user runner $password /add
          net localgroup administrators runner /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Write-Host "RDP enabled. User: runner, Password: $password"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          Invoke-WebRequest -Uri $tsUrl -OutFile "$env:TEMP\tailscale-setup.exe"
          Start-Process -Wait -FilePath "$env:TEMP\tailscale-setup.exe" -ArgumentList "/silent"
          Write-Host "Tailscale installed"

      - name: Start Tailscale and get login URL
        run: |
          $env:Path = "C:\Program Files\Tailscale;$env:Path"
          $proc = Start-Process -FilePath "tailscale" -ArgumentList "up --hostname=darling-windows --accept-routes" -PassThru -RedirectStandardOutput "$env:TEMP\ts-out.txt" -RedirectStandardError "$env:TEMP\ts-err.txt"
          Start-Sleep -Seconds 10
          Write-Host "=== Tailscale login URL ==="
          Get-Content "$env:TEMP\ts-err.txt"
          Get-Content "$env:TEMP\ts-out.txt"
          Write-Host "=== Waiting for login... ==="
          Start-Sleep -Seconds 60

      - name: Show Tailscale status
        run: |
          $env:Path = "C:\Program Files\Tailscale;$env:Path"
          tailscale status
          tailscale ip -4

      - name: Keep alive for 5 hours
        run: |
          Write-Host "RDP ready. Connect via Tailscale IP."
          Write-Host "User: runner"
          $env:Path = "C:\Program Files\Tailscale;$env:Path"
          for ($i = 0; $i -lt 290; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "Running... $i min elapsed"
          }
