name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - name: Create user and enable RDP
        run: |
          $password = "Rdp@2026X"
          net user darling $password /add
          net localgroup administrators darling /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "RDP ready. User: darling, Password: Rdp@2026X"

      - name: Install and login Tailscale
        run: |
          $env:Path = "C:\Program Files\Tailscale;$env:Path"
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://tailscale.com/install.ps1'))
          Write-Host "=== Tailscale installed, starting login ==="
          tailscale up --hostname=darling-windows --accept-routes
          Write-Host "=== Tailscale logged in! ==="
          tailscale ip -4

      - name: Keep alive for 5 hours
        run: |
          $env:Path = "C:\Program Files\Tailscale;$env:Path"
          Write-Host "RDP ready!"
          Write-Host "User: darling"
          Write-Host "Password: Rdp@2026X"
          tailscale ip -4
          for ($i = 0; $i -lt 290; $i++) {
            Start-Sleep -Seconds 60
          }
