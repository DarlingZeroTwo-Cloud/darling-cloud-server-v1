name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - name: Create user and enable RDP
        run: |
          net user darling "Darling02!" /add
          net localgroup administrators darling /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "RDP ready. User: darling, Password: Darling02!"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          Invoke-WebRequest -Uri $tsUrl -OutFile "$env:TEMP\tailscale-setup.exe"
          Start-Process -Wait -FilePath "$env:TEMP\tailscale-setup.exe" -ArgumentList "/silent"
          Write-Host "Tailscale installed"

      - name: Login to Tailscale (wait for browser auth)
        run: |
          $env:Path = "C:\Program Files\Tailscale;$env:Path"
          tailscale up --hostname=darling-windows --accept-routes
          Write-Host "=== Tailscale logged in! ==="
          tailscale ip -4

      - name: Keep alive for 5 hours
        run: |
          $env:Path = "C:\Program Files\Tailscale;$env:Path"
          Write-Host "RDP ready!"
          Write-Host "User: darling"
          Write-Host "Password: Darling02!"
          tailscale ip -4
          for ($i = 0; $i -lt 290; $i++) {
            Start-Sleep -Seconds 60
          }
